---
- name: Fail early on unsupported distributions
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
      - docker_apt_distribution in ['debian', 'ubuntu']
    fail_msg: >-
      This role installs Docker from the official APT repository, which exists
      only for debian and ubuntu. Detected
      os_family={{ ansible_facts['os_family'] }},
      distribution={{ ansible_facts['distribution'] }},
      resolved to '{{ docker_apt_distribution }}'.
      Override docker_apt_distribution and docker_apt_suite to proceed.
    quiet: true

- name: Install APT prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure the APT keyring directory exists
  ansible.builtin.file:
    path: "{{ docker_apt_keyring_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the Docker APT signing key
  ansible.builtin.get_url:
    url: "{{ docker_apt_gpg_url }}"
    dest: "{{ docker_apt_keyring_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Configure the Docker APT repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "{{ docker_apt_repo_url }}"
    suites: "{{ docker_apt_suite }}"
    components: "{{ docker_apt_components }}"
    architectures: "{{ docker_apt_architecture }}"
    signed_by: "{{ docker_apt_keyring_path }}"
    enabled: true
    state: present
  register: docker_apt_repository

# Atualizar o cache só quando o repositório muda mantém a segunda execução em
# changed=0 sem quebrar a primeira, que ainda não conhece o docker-ce.
- name: Install Docker Engine, CLI and plugins
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: "{{ docker_apt_repository.changed }}"

- name: Install the Docker SDK for Python
  ansible.builtin.apt:
    name: "{{ docker_sdk_package }}"
    state: present

- name: Ensure the Docker configuration directory exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure the Docker daemon
  ansible.builtin.copy:
    src: daemon.json
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

- name: Ensure the Docker service is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ docker_service_name }}"
    enabled: "{{ docker_service_enabled }}"
    state: "{{ docker_service_state }}"
