---
- name: Ensure the application directory exists
  ansible.builtin.file:
    path: "{{ korp_app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Sync the application sources
  ansible.builtin.copy:
    src: "{{ korp_app_src }}/"
    dest: "{{ korp_app_dir }}/"
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"

- name: Create the application network
  community.docker.docker_network:
    name: "{{ korp_network_name }}"
    driver: bridge
    state: present

# rebuild defaults to never, so an existing tag is left alone and the second run
# reports no change. Bumping korp_app_version is what triggers a rebuild.
- name: Build the application image
  community.docker.docker_image_build:
    name: "{{ korp_app_image }}"
    tag: "{{ korp_app_version }}"
    path: "{{ korp_app_dir }}"
    args:
      VERSION: "{{ korp_app_version }}"
      COMMIT: "{{ korp_app_commit }}"
