# Incus demo VM. The host name is the instance identifier.
[incus]
lab

[incus:vars]
ansible_connection=community.general.incus
ansible_incus_remote=local
ansible_incus_project=default
ansible_user=root

# SSH path for any Debian or Ubuntu host: comment the block above and uncomment
