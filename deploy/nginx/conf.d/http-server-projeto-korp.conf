resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Resolved per request through the variable below. With a literal upstream
    # NGINX caches the IP at startup and serves 502 once the app container is
    # recreated with a new address.
    set $upstream http-server-projeto-korp;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # $request_uri is mandatory here: a proxy_pass carrying a variable does not
    # forward the URI on its own, and the path would be dropped.
    location = /projeto-korp {
        proxy_pass http://$upstream:8080$request_uri;
    }

    location / {
        proxy_pass http://$upstream:8080$request_uri;
    }
}
